tags:
  - Contacts
summary: Update contact
operationId: updateContact
security:
  - bearerAuth: []

parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string

requestBody:
  content:
    application/json:
      schema:
        $ref: '../../../components/schemas.yaml#/Contact'

responses:
  '200':
    description: Contact updated

  '404':
    description: Contact not found